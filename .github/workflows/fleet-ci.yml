name: Fleet CI (test-gate)

# Runs the project's REAL checks on the autonomous worker's PRs (head branch
# `auto/*`) so a worker change that breaks the build/tests shows a RED check
# BEFORE merge — turning "tests pass" into an observed fact. Best-effort installs
# (tooling/install problems => neutral pass, can't verify so don't block); only an
# ACTUAL failure (tests, Node build, pytest, invalid fleet config) returns non-zero
# and reds the check. Static across repos — copied verbatim by propagate_ci.sh.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test-gate:
    if: startsWith(github.head_ref, 'auto/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Run project checks (real failures red; install issues neutral)
        run: |
          # No `set -e`: install/tooling problems => neutral pass. Real failures => RED.
          fail=0

          # ---- Node (root, else a single nested app dir) ----
          pkgdir=""
          if [ -f package.json ]; then pkgdir="."
          else pkgdir=$(ls -d */package.json 2>/dev/null | head -1 | xargs -r dirname); fi
          if [ -n "$pkgdir" ] && [ -f "$pkgdir/package.json" ]; then
            echo "== Node project at: $pkgdir =="
            ( cd "$pkgdir"
              if npm ci >/dev/null 2>&1 || npm install >/dev/null 2>&1; then
                if grep -q '"test"[[:space:]]*:' package.json; then
                  echo "-- npm test --"; npm test || exit 21; fi
                if grep -q '"build"[[:space:]]*:' package.json; then
                  echo "-- npm run build --"; npm run build || exit 22; fi
              else
                echo "node install failed — neutral pass (cannot verify)"
              fi )
            rc=$?; [ $rc -ne 0 ] && { echo "NODE CHECK FAILED (rc=$rc)"; fail=1; }
          fi

          # ---- Python (pytest is the real gate; install issues stay neutral) ----
          if ls pyproject.toml requirements*.txt setup.py >/dev/null 2>&1; then
            echo "== Python project =="
            python3 -m pip install -q --upgrade pip >/dev/null 2>&1 || true
            [ -f requirements.txt ] && pip install -q -r requirements.txt >/dev/null 2>&1 || true
            [ -f pyproject.toml ] && pip install -q -e . >/dev/null 2>&1 || true
            pip install -q pytest >/dev/null 2>&1 || true
            if [ -d tests ]; then echo "-- pytest --"; pytest -q || fail=1; fi
          fi

          # ---- Fleet infra self-validation (only where fleet/ exists) ----
          if [ -f fleet/projects.json ]; then
            echo "== Fleet config validation =="
            python3 -c "import json; json.load(open('fleet/projects.json'))" \
              || { echo "projects.json is invalid JSON"; fail=1; }
            for slug in $(python3 -c "import json;print(' '.join(p['slug'] for p in json.load(open('fleet/projects.json'))['projects'] if p.get('enabled') and p.get('tier')!='excluded'))" 2>/dev/null); do
              if ! python3 fleet/scripts/render_worker.py "$slug" > /tmp/r.yml 2>/dev/null || [ ! -s /tmp/r.yml ]; then
                echo "render_worker failed for $slug"; fail=1; fi
            done
            echo "fleet config + renders OK"
          fi

          if [ "$fail" = "1" ]; then echo "❌ Fleet CI: a real check failed"; exit 1; fi
          echo "✅ Fleet CI: all runnable checks passed (neutral where uncheckable)."
